<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Muscle Anatomy</title>
  <link rel="stylesheet" href="./anatomy-component/styles.css" />
</head>
<body>
  <main class="page">
    <section class="muscle-anatomy" data-component="muscle-anatomy">
      <header class="anatomy-header">
        <h1>Muscle Anatomy</h1>
        <div class="view-controls">
          <button type="button" class="view-btn is-active" data-view="front" aria-pressed="true">Front</button>
          <button type="button" class="view-btn" data-view="back" aria-pressed="false">Back</button>
        </div>
      </header>

      <div class="anatomy-stage">
        <div class="svg-shell" id="svg-shell" aria-live="polite"></div>
        <div class="tooltip" id="muscle-tooltip" role="status" aria-hidden="true"></div>
      </div>

      <aside class="info-panel">
        <h2>Selected Muscle</h2>
        <p id="selected-muscle">None</p>
        <h3>Linked Exercises</h3>
        <ul id="exercise-list">
          <li>Click a muscle to view exercises.</li>
        </ul>
      </aside>
    </section>
  </main>

  <script src="./anatomy-component/script.js"></script>
</body>
</html>
